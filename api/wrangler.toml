name = "xd-menu"
main = "worker.js"
compatibility_date = "2026-08-01"

# База создана 26 августа 2026 в регионе EEUR. Привязка называется DB —
# именно её читает worker.js (env.DB), не переименовывайте.
[[d1_databases]]
binding = "DB"
database_name = "xd-menu"
database_id = "e0c19bba-8f23-43a5-b003-9bc19567a5a7"

# Снимки блюд, которые заведение загружает из админки прямо с телефона.
# KV, а не R2: бесплатного гигабайта хватает с большим запасом, а R2
# просит привязать карту даже на бесплатном тарифе.
[[kv_namespaces]]
binding = "PHOTOS"
id = "ee3014b14f7746359b2a9d8e11fb7a18"
